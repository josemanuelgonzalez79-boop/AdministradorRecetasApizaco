<p-confirmDialog
  appendTo="body"
  header="Confirmar eliminación"
  icon="pi pi-exclamation-triangle"
  [style]="{ width: '400px' }"
  styleClass="custom-confirm-dialog"
  acceptLabel="Sí, eliminar"
  rejectLabel="Cancelar"
></p-confirmDialog>

<div class="modal-overlay" (click)="cerrar()"></div>
<div class="modal">
  <h2>Componentes</h2>

  <div class="form-group">
    <label for="componente">Componente:</label>
    <p-dropdown
      id="componente"
      [options]="componentes"
      [(ngModel)]="componenteSeleccionado"
      (onChange)="onComponenteSeleccionado($event)"
      placeholder="Seleccione un componente"
      styleClass="dropdown-estilizado"
      appendTo="body"
      [filter]="true"
      [scrollHeight]="'200px'"
      [autoDisplayFirst]="false"
    ></p-dropdown>
  </div>

  <form>
    <div class="form-group">
      <label>Último cambio:</label>
      <input type="text" [value]="updateTimeFormateado" [disabled]="!banderaUltimoCambio" />
    </div>

    <div class="form-group">
      <label>Identificador:</label>
      <input type="text" [value]="id" [disabled]="!banderaIdentificador" />
    </div>

    <div class="form-group">
      <label>Nombre:</label>
      <input
        type="text"
        id="name"
        name="name"
        [(ngModel)]="name"
        [disabled]="soloLectura || !banderaNombre"
      />
    </div>

    <div class="form-group">
      <label>Referencia:</label>
      <input
        type="text"
        id="recipeReference"
        name="recipeReference"
        [(ngModel)]="recipeReference"
        [disabled]="soloLectura || !banderaReferencia"
      />
    </div>

    <div class="form-group">
      <label>Tipo:</label>
      <select
        id="tipo"
        name="tipo"
        [(ngModel)]="tipo"
        (ngModelChange)="onTipoAutomaticaChange($event)"
        [disabled]="soloLectura || !banderaTipo"
      >
        <option [ngValue]="0">-</option>
        <option [ngValue]="1">Sólido</option>
        <option [ngValue]="2">Líquido</option>
      </select>
    </div>

    <div class="form-group">
      <label>Masa:</label>
      <input
        type="number"
        id="masa"
        name="masa"
        min="0"
        (keypress)="onlyNumberAndPoint($event, mass)"
        [(ngModel)]="mass"
        [disabled]="soloLectura || !banderaMasa"
      />
      kg
    </div>

    <div class="form-group">
      <div class="form-group__header">
        <div class="dual-head">
          <span class="dual-title">Prebatch 1</span>
          <input
            type="radio"
            id="prebatch1"
            name="modo"
            [(ngModel)]="modo"
            (ngModelChange)="modoChange($event)"
            value="prebatch1"
            class="dual-radio"
            [disabled]="soloLectura || !banderaPrebatch1"
          />
        </div>

        <div class="dual-head dual-head--right">
          <span class="dual-title">Paragon</span>
          <input
            type="radio"
            id="paragon"
            name="modo"
            [(ngModel)]="modo"
            (ngModelChange)="modoChange($event)"
            value="paragon"
            class="dual-radio"
            [disabled]="soloLectura || !banderaParagon"
          />
        </div>

      </div>
    </div>

<div class="dual-grid">
  <div class="dual-col">
    <div class="form-group">
      <label>Agua Prebatch 1:</label>
      <input
        type="number"
        id="water"
        name="water"
        min="0"
        (keypress)="onlyNumberAndPoint($event, mass)"
        [(ngModel)]="prebatchState.water"
        [disabled]="soloLectura || !banderaAgua"
      />
      kg
    </div>
  </div>

  <div class="dual-col">
    <div class="form-group">
      <label>Agua Paragon:</label>
      <input
        type="number"
        id="waterParagon"
        name="waterParagon"
        min="0"
        (keypress)="onlyNumberAndPoint($event, mass)"
        [(ngModel)]="paragonState.water"
        [disabled]="soloLectura || !banderaAguaParagon"
      />
      kg
    </div>
  </div>
</div>

    <label class="bold">Solidos:</label>

    <div class="checkbox-columns">
      <div class="checkbox-col">
        <div class="checkbox-item">
          <input
            type="checkbox"
            id="recircular"
            name="recircular"
            [(ngModel)]="prebatchState.recircular"
            (ngModelChange)="onRecircularChange($event)"
            [disabled]="soloLectura || !banderaRecircular"
          />
          <label for="recircular">Recircular</label>
        </div>

        <div class="checkbox-item">
          <input
            type="checkbox"
            id="dificil"
            name="dificil"
            [(ngModel)]="prebatchState.dificil"
            (ngModelChange)="onDisolucionChange($event)"
            [disabled]="soloLectura || !banderaDisolucionDificil"
          />
          <label for="dificil">Disolución difícil (usar disolutor)</label>
        </div>

        <div class="checkbox-item">
          <input
            type="checkbox"
            id="cargaDirecta"
            name="cargaDirecta"
            [(ngModel)]="prebatchState.cargaDirecta"
            [disabled]="soloLectura || !banderaCargaDirecta"
          />
          <label for="cargaDirecta">Carga directa de agua</label>
        </div>
      </div>

      <div class="checkbox-col">
        <div class="checkbox-item">
          <input
            type="checkbox"
            id="cargaDirecta2"
            name="cargaDirecta2"
            [(ngModel)]="paragonState.cargaDirecta2"
            [disabled]="soloLectura || !banderaCargaDirecta2"
          />
          <label for="cargaDirecta2">Carga directa de agua</label>
        </div>
      </div>
    </div>
<br>
    <label class="bold">Liquidos:</label>

    <div class="dual-grid">
      <div class="dual-col">
        <div class="radio-item">
          <input
            type="radio"
            id="tanque"
            name="origen"
            [(ngModel)]="prebatchState.origen"
            (ngModelChange)="onOrigenChange($event)"
            value="tanque"
            [disabled]="soloLectura || !banderaTanque"
          />
          <label for="tanque">Tanque</label>
        </div>

        <div class="radio-item">
          <input
            type="radio"
            id="bayoneta"
            name="origen"
            [(ngModel)]="prebatchState.origen"
            (ngModelChange)="onOrigenChange($event)"
            value="bayoneta"
            [disabled]="soloLectura || !banderaBayoneta"
          />
          <label for="bayoneta">Bayoneta</label>
        </div>
      </div>

      <div class="dual-col">
        <div class="radio-item">
          <input
            type="radio"
            id="o2_t01"
            name="origen2"
            value="t01"
            [(ngModel)]="paragonState.origen2"
            [ngModelOptions]="{ standalone: true }"
            (ngModelChange)="onOrigen2Change($event)"
            [attr.disabled]="paragonRadioDisabled('t01') ? '' : null"
          />
          <label for="o2_t01">T01</label>
        </div>

        <div class="radio-item">
          <input
            type="radio"
            id="o2_t02"
            name="origen2"
            value="t02"
            [(ngModel)]="paragonState.origen2"
            [ngModelOptions]="{ standalone: true }"
            (ngModelChange)="onOrigen2Change($event)"
            [attr.disabled]="paragonRadioDisabled('t02') ? '' : null"
          />
          <label for="o2_t02">T02</label>
        </div>

        <div class="radio-item">
          <input
            type="radio"
            id="o2_b01"
            name="origen2"
            value="b01"
            [(ngModel)]="paragonState.origen2"
            [ngModelOptions]="{ standalone: true }"
            (ngModelChange)="onOrigen2Change($event)"
            [attr.disabled]="paragonRadioDisabled('b01') ? '' : null"
          />
          <label for="o2_b01">B01</label>
        </div>

        <div class="radio-item">
          <input
            type="radio"
            id="o2_ibc"
            name="origen2"
            value="ibc"
            [(ngModel)]="paragonState.origen2"
            [ngModelOptions]="{ standalone: true }"
            (ngModelChange)="onOrigen2Change($event)"
            [attr.disabled]="paragonRadioDisabled('ibc') ? '' : null"
          />
          <label for="o2_ibc">IBC</label>
        </div>

        <div class="radio-item">
          <input
            type="radio"
            id="o2_tn01"
            name="origen2"
            value="tn01"
            [(ngModel)]="paragonState.origen2"
            [ngModelOptions]="{ standalone: true }"
            (ngModelChange)="onOrigen2Change($event)"
            [attr.disabled]="paragonRadioDisabled('tn01') ? '' : null"
          />
          <label for="o2_tn01">TN01</label>
        </div>
      </div>

    </div>

    <div class="dual-grid section-top">
      <div class="dual-col">
        <label class="bold">Agitación Prebatch 1:</label>
        <div class="checkbox-item">
          <input
            type="checkbox"
            id="agitacion"
            name="agitacion"
            [(ngModel)]="prebatchState.agitacionAuto"
            (ngModelChange)="onAgitacionAutomaticaChange($event)"
            [disabled]="soloLectura || !banderaAutomatica"
          />
          <label for="agitacion">Automática</label>
        </div>
      </div>

      <div class="dual-col">
        <label class="bold">Agitación Paragon:</label>
        <div class="checkbox-item">
          <input
            type="checkbox"
            id="agitacion2"
            name="agitacion2"
            [(ngModel)]="paragonState.agitacionAuto2"
            (ngModelChange)="onAgitacionParagonChange($event)"
            [disabled]="agitacionParagonDisabled()"
          />
          <label for="agitacion2">Automática</label>
        </div>
      </div>
    </div>

    <div class="dual-grid section-top">
      <div class="form-group time-block">
        <label class="bold">Tiempo Prebatch 1:</label>
        <div class="time-inputs">
          <input
            type="number"
            id="hora"
            name="hora"
            min="0"
            (keypress)="onlyInteger($event)"
            placeholder="h"
            [(ngModel)]="prebatchState.h"
            [disabled]="soloLectura || !banderaAgitacionAutomatica"
          />
          <input
            type="number"
            id="minuto"
            name="minuto"
            min="0"
            (keypress)="onlyInteger($event)"
            placeholder="min"
            [(ngModel)]="prebatchState.m"
            [disabled]="soloLectura || !banderaAgitacionAutomatica"
          />
          <input
            type="number"
            id="segundo"
            name="segundo"
            min="0"
            (keypress)="onlyInteger($event)"
            placeholder="s"
            [(ngModel)]="prebatchState.s"
            [disabled]="soloLectura || !banderaAgitacionAutomatica"
          />
        </div>
      </div>

      <div class="form-group time-block">
        <label class="bold">Tiempo Paragon:</label>
        <div class="time-inputs">
          <input
            type="number"
            id="horaParagon"
            name="horaParagon"
            min="0"
            (keypress)="onlyInteger($event)"
            placeholder="h"
            [(ngModel)]="paragonState.h2"
            [disabled]="soloLectura || !banderaAgitacionAutomaticaParagon"
          />
          <input
            type="number"
            id="minutoParagon"
            name="minutoParagon"
            min="0"
            (keypress)="onlyInteger($event)"
            placeholder="min"
            [(ngModel)]="paragonState.m2"
            [disabled]="soloLectura || !banderaAgitacionAutomaticaParagon"
          />
          <input
            type="number"
            id="segundoParagon"
            name="segundoParagon"
            min="0"
            (keypress)="onlyInteger($event)"
            placeholder="s"
            [(ngModel)]="paragonState.s2"
            [disabled]="soloLectura || !banderaAgitacionAutomaticaParagon"
          />
        </div>
      </div>
    </div>

    <div class="dual-grid section-top">
      <div class="form-group">
        <label class="bold">Comentarios Prebatch 1:</label>
        <textarea
          rows="4"
          id="comentarios"
          name="comentarios"
          [disabled]="soloLectura || !banderaComentarios"
          [(ngModel)]="prebatchState.comentarios"
        ></textarea>
      </div>

      <div class="form-group">
        <label class="bold">Comentarios Paragon:</label>
        <textarea
          rows="4"
          id="comentarios2"
          name="comentarios2"
          [disabled]="soloLectura || !banderaComentariosParagon"
          [(ngModel)]="paragonState.comentarios2"
        ></textarea>
      </div>
    </div>

    <div class="modal-buttons">
      <button type="button" class="btn save" (click)="guardado()" [disabled]="soloLectura || !banderaGuardar">
        Guardar
      </button>
      <button type="button" class="btn" (click)="banderaMostrarDialogo = true" [disabled]="soloLectura">
        Nuevo
      </button>
      <button type="button" class="btn danger" (click)="eliminar()" [disabled]="soloLectura || !banderaEliminar">
        Eliminar
      </button>
      <button type="button" class="btn" (click)="intentarCerrar()">Cancelar</button>
    </div>
  </form>
</div>

<p-dialog
  header="Nuevo componente"
  [(visible)]="banderaMostrarDialogo"
  [modal]="true"
  [style]="{ width: '480px', height: '700px' }"
  [baseZIndex]="2000"
>
  <div class="form-grid">
    <div class="form-group">
      <label for="identificador">Identificador:</label>
      <input id="identificador" name="identificador" type="text" pInputText [(ngModel)]="idNuevoComponente" />
    </div>

    <div class="form-group">
      <label for="nombre">Nombre:</label>
      <input id="nombre" name="nombre" type="text" pInputText [(ngModel)]="nombreNuevoComponente" />
    </div>

    <div class="form-group">
      <label for="referencia">Referencia:</label>
      <input id="referencia" name="referencia" type="text" pInputText [(ngModel)]="referenciaNuevoComponente" />
    </div>

    <div class="form-group">
      <label for="tipo">Tipo:</label>
      <p-dropdown
        id="tipo"
        name="tipo"
        [options]="tipos"
        [(ngModel)]="tipoNuevoComponente"
        placeholder="-"
        [style]="{ width: '100%', height: '100%' }"
      ></p-dropdown>
    </div>
  </div>

  <p-footer>
    <div class="dialog-footer">
      <button pButton type="button" label="Crear" (click)="validaNoObsoleto()" [disabled]="!puedeCrearNueva" class="p-button-primary"></button>
      <button pButton type="button" label="Cancelar" (click)="limpiaCreaComponente()" class="p-button-secondary"></button>
    </div>
  </p-footer>
</p-dialog>
