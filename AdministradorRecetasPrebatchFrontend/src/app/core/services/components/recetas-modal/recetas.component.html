<div class="modal-backdrop" (click)="cerrar()"></div>

<div class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-recetas">

  <div class="modal__header">
    <h2 id="titulo-recetas">Recetas</h2>
    <button class="modal__close" aria-label="Cerrar" (click)="cerrar()">×</button>
  </div>

  <div class="modal__body">
    <div class="win">
      <div class="win__header">
        <p-dropdown
          id="receta"
          [options]="recetas"
          [(ngModel)]="recetaSeleccionada"
          (onChange)="onRecetaSeleccionada($event)"
          placeholder="Seleccione una receta"
          styleClass="dropdown-estilizado"
          appendTo="body"
          [filter]="true"
          [scrollHeight]="'200px'"
          [autoDisplayFirst]="false"
        ></p-dropdown>
      </div>

      <div class="form">
        <label class="form__label">Último cambio:</label>
        <div class="form__field">
      <input type="text" class="input" [value]="updateTime" disabled/>
        </div>

        <label class="form__label">Identificador:</label>
        <div class="form__field form__row">
          <input class="input" type="text" [value]="id" disabled/>
          <div class="form__kv">
            <span class="form__kv-key">PLC:</span>
            <input class="input" type="text" [value]="idNumeric" disabled/>
          </div>
        </div>

        <label class="form__label">Nombre:</label>
        <div class="form__field">
          <input id="name" name="name" class="input" type="text" [(ngModel)]="name" [disabled]="!banderaNombre" />
        </div>

        <label class="form__label">Jarabe:</label>
        <div class="form__field form__unit">
          <input class="input input--sm" type="number" id="mass" name="mass" (keypress)="onlyNumberAndPoint($event, mass)" (ngModelChange)="recomputeFinishedVolume()" min="0" [(ngModel)]="mass" [disabled]="!banderaMass"/>
          <span class="unit">kg</span>
          <label class="muted">{{ finishedSyrupVolume }}</label>
        </div>

        <label class="form__label">Brix:</label>
        <div class="form__field form__unit">
          <input class="input input--sm" type="number" id="brix" (keypress)="onlyNumberAndPoint($event, mass)" name="brix" min="0" [(ngModel)]="brix" [disabled]="!banderaBrix" />
          <span class="unit">°Bx</span>
        </div>

        <label class="form__label">Densidad:</label>
        <div class="form__field form__unit">
          <input class="input input--sm" type="number" id="density" name="density" min="0" (keypress)="onlyNumberAndPoint($event, mass)" (ngModelChange)="recomputeFinishedVolume()" [(ngModel)]="density" [disabled]="!banderaDensity" />
          <span class="unit">g/cm³</span>
        </div>

        <label class="form__label">Tipo:</label>
        <div class="form__field">
          <p-dropdown 
            [options]="types"
            [(ngModel)]="selectedType"
            (onChange)="onTipoChange($event)"
            placeholder="Selecciona un tipo"
            [disabled]="!banderaTipo"
            class="dropdown-estilizado">
          </p-dropdown>
        </div>

        <label class="form__label">Sacarosa:</label>
        <div class="form__field form__unit">
          <input class="input input--sm" type="number" (keypress)="onlyNumberAndPoint($event, mass)" id="sucrose" name="sucrose" min="0" [(ngModel)]="sucrose" [disabled]="soloLectura || !banderaSucrose" />
          <span class="unit">kg</span>
        </div>

        <label class="form__label">Fructosa:</label>
        <div class="form__field form__unit">
          <input class="input input--sm" type="number" (keypress)="onlyNumberAndPoint($event, mass)" id="fructose" name="fructose" min="0" [(ngModel)]="fructose" [disabled]="soloLectura || !banderaFructose" />
          <span class="unit">kg</span>
        </div>

        <label class="form__label">Agua:</label>
        <div class="form__field form__unit">
          <input class="input input--sm" type="number" id="water" (keypress)="onlyNumberAndPoint($event, mass)" name="water" min="0" [(ngModel)]="water" disabled />
          <span class="unit">kg</span>
        </div>

        <label class="form__label">Agitación:</label>
        <div class="form__field form__hms">
          <input class="input input--xs" type="number" id="agitationHours" name="agitationHours" [(ngModel)]="agitationHours" [disabled]="!banderaAgitationHours" min="0" step="1" (keypress)="onlyInteger($event)" /><span>h</span>
          <input class="input input--xs" type="number" id="agitationMinutes" name="agitationMinutes" [(ngModel)]="agitationMinutes" [disabled]="!banderaAgitationMinutes" min="0" step="1" (keypress)="onlyInteger($event)" /><span>min</span>
          <input class="input input--xs" type="number" id="agitationSeconds" name="agitationSeconds" [(ngModel)]="agitationSeconds" [disabled]="!banderaAgitationSeconds" min="0" step="1" (keypress)="onlyInteger($event)" /><span>s</span>
        </div>

        <label class="form__label">Reposo:</label>
        <div class="form__field form__hms">
          <input class="input input--xs" type="number" id="holdingHours" name="holdingHours" [(ngModel)]="holdingHours" [disabled]="!banderaHoldingHours" min="0" step="1" (keypress)="onlyInteger($event)" /><span>h</span>
          <input class="input input--xs" type="number" id="holdingMinutes" name="holdingMinutes" [(ngModel)]="holdingMinutes" [disabled]="!banderaHoldingMinutes" min="0" step="1" (keypress)="onlyInteger($event)" /><span>min</span>
          <input class="input input--xs" type="number" id="holdingSeconds" name="holdingSeconds" [(ngModel)]="holdingSeconds" [disabled]="!banderaHoldingSeconds" min="0" step="1" (keypress)="onlyInteger($event)" /><span>s</span>
        </div>
      </div>

  <div class="box">
    <div class="box__head box__grid">
      <span>Componente</span>
      <span class="box__head-pos">Posición</span>
    </div>

    <div class="box__list">
      <div class="box__row box__grid" *ngFor="let fila of filas; let i = index">
        <p-dropdown
          [options]="optionsPorFila[i] || comboComponentes"
          [(ngModel)]="fila.componenteId"
          (onChange)="onComponenteChange(i, $event)"
          placeholder="Seleccione componente"
          [filter]="true"
          [showClear]="true"
          [virtualScroll]="true"
          [virtualScrollItemSize]="28"
          appendTo="body"
          [panelStyle]="{maxHeight:'260px'}"
          styleClass="dropdown-estilizado"
          [style]="{width:'100%'}"
          [disabled]=" soloLectura || !fila.enabled">
        </p-dropdown>

        <!-- Posición -->
        <p-dropdown
          [options]="fila.posDrop"
          [(ngModel)]="fila.posicion"
          (onChange)="onPosChange(i)"
          placeholder="-"
          appendTo="body"
          styleClass="pos-dropdown"
          [disabled]=" soloLectura || !fila.posEnabled">
        </p-dropdown>
      </div>
    </div>
  </div>

      <div class="form form--row">
        <label class="form__label">Comentarios:</label>
        <div class="form__field">
          <textarea class="input textarea" rows="3" id="comments" name="comments" [(ngModel)]="comments" [disabled]="!banderaComentarios" ></textarea>
        </div>
      </div>
    </div>
  </div>

    <div class="modal__footer">
      <button type="button" class="btn btn--primary" (click)="guardarReceta()" [disabled]="!banderaBtnGuardar" >Guardar</button>
      <button class="btn" (click)="abrirNueva()" [disabled]="soloLectura" >Nueva</button>
      <button class="btn btn--danger" (click)="eliminarReceta()" [disabled]="!banderaBtnEliminar" >Eliminar</button>
      <button class="btn" (click)="cerrar()">Cancelar</button>
    </div>
  </div>

  <!-- NUEVA RECETA -->
  <ng-container *ngIf="mostrarNueva">
  <div class="backdrop backdrop--nueva" (click)="cerrarNueva()"></div>

  <div
    class="newrec"
    role="dialog"
    aria-modal="true"
    aria-labelledby="titulo-nueva-receta"
    (click)="$event.stopPropagation()"
  >
    <div class="newrec__header">
      <span id="titulo-nueva-receta">Nueva receta</span>
      <button class="newrec__close" (click)="cerrarNueva()">×</button>
    </div>

    <div class="newrec__body">
      <div class="newrec__form">

        <label class="newrec__label">Identificador:</label>
        <div class="newrec__field">
          <input
            type="text"
            min="0"
            (keypress)="onlyInteger($event)"
            maxlength="15"
            class="input input--sm"
            [(ngModel)]="nueva.id"
            (keydown.enter)="onEnterNuevaId($event)"
            autocomplete="off"
            (input)="sanearId($event)"
          />
        </div>

        <label class="newrec__label">Nombre:</label>
        <div class="newrec__field">
          <input
            class="input"
            [(ngModel)]="nueva.nombre"
            [disabled]="!banderaNuevaNombre"
            autocomplete="off"
          />
        </div>

        <label class="newrec__label">Jarabe:</label>
        <div class="newrec__field newrec__unit">
          <input
            class="input input--sm"
            type="number"
            inputmode="decimal"
            [(ngModel)]="nueva.jarabe"
            (ngModelChange)="recalcNuevaVolumenYAgua()"
            (blur)="onBlurCuatroDecimales('jarabe')"
            [disabled]="!banderaNuevaJarabe"
            min="0"
          />
          <span class="unit">kg</span>
          <span class="muted">{{ finishedSyrupVolumeNueva }}</span>
        </div>

        <label class="newrec__label">Brix:</label>
        <div class="newrec__field newrec__unit">
          <input
            class="input input--sm"
            type="number"
            inputmode="decimal"
            [(ngModel)]="nueva.brix"
            (blur)="onBlurCuatroDecimales('brix')"
            [disabled]="!banderaNuevaBrix"
            min="0"
          />
          <span class="unit">°Bx</span>
        </div>

        <label class="newrec__label">Densidad:</label>
        <div class="newrec__field newrec__unit">
          <input
            class="input input--sm"
            type="number"
            inputmode="decimal"
            [(ngModel)]="nueva.densidad"
            (ngModelChange)="recalcNuevaVolumenYAgua()"
            (blur)="onBlurDensidad()"
            [disabled]="!banderaNuevaDensidad"
            min="0"
          />
          <span class="unit">g/cm³</span>
        </div>

        <label class="newrec__label">Tipo:</label>
        <div class="newrec__field">
          <p-dropdown
            [options]="types"
            [(ngModel)]="nueva.tipo"
            (onChange)="onTipoNuevaChange($event.value)"
            placeholder="-"
            [disabled]="!banderaNuevaTipo"
            class="dropdown-estilizado"
          ></p-dropdown>
        </div>

        <label class="newrec__label">Sacarosa:</label>
        <div class="newrec__field newrec__unit">
          <input
            class="input input--sm"
            type="number"
            inputmode="decimal"
            [(ngModel)]="nueva.sacarosa"
            (ngModelChange)="recalcNuevaVolumenYAgua()"
            [disabled]="!banderaNuevaSucrosa"
            min="0"
          />
          <span class="unit">kg</span>
        </div>

        <label class="newrec__label">Fructosa:</label>
        <div class="newrec__field newrec__unit">
          <input
            class="input input--sm"
            type="number"
            inputmode="decimal"
            [(ngModel)]="nueva.fructosa"
            (ngModelChange)="recalcNuevaVolumenYAgua()"
            [disabled]="!banderaNuevaFructosa"
            min="0"
          />
          <span class="unit">kg</span>
        </div>

        <label class="newrec__label">Agua:</label>
        <div class="newrec__field newrec__unit">
          <input
            class="input input--sm"
            type="number"
            inputmode="decimal"
            [(ngModel)]="nueva.agua"
            [disabled]="!banderaNuevaAgua"
            min="0"
          />
          <span class="unit">kg</span>
        </div>

        <div class="newrec__subtitle">Primer componente (obligatorio)</div>
        <div class="newrec__field newrec__field--full">
          <p-dropdown
            [options]="comboComponentes"
            optionLabel="label"
            optionValue="value"
            [(ngModel)]="nueva.componente"
            placeholder="Seleccione componente"
            [filter]="true"
            appendTo="body"
            [disabled]="!banderaNuevaComponentes"
            class="dropdown-estilizado"
          ></p-dropdown>
        </div>
      </div>
    </div>

    <div class="newrec__footer">
      <button class="btn btn--primary" [disabled]="!puedeCrearNueva()" (click)="crearNueva()">Crear</button>
      <button class="btn" (click)="cerrarNueva()">Cancelar</button>
    </div>
  </div>
  
</ng-container>
<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>
