<!-- Si el usuario está autenticado -->
<div
  *ngIf="(isAuth$ | async); else publicArea"
  [class.has-modal]="mostrarModal || mostrarRecetas || mostrarProcesos || mostrarUsuarios || mostrarPresentaciones"
>

  <header class="app-bar">
    <div class="bar">
      <img
        ngSrc="assets/LOGO-ICAP.png"
        width="640"   
        height="257" 
        alt="Logo ICAP"
        priority
        class="logo"
      />

      <nav class="menu" aria-label="Principal">
        <ul class="menu-list">
          <li class="menu-item"
              (mouseenter)="showSubmenu('formulacion')"
              (mouseleave)="hideSubmenu('formulacion')">
            <button class="menu-link" type="button" (click)="toggleSubmenu('formulacion')">
              Formulación
            </button>
            <ul class="submenu" *ngIf="visibleMenu === 'formulacion'">
              <li><button type="button" (click)="navegar('componentes')">Componentes</button></li>
              <li><button type="button" (click)="navegar('recetas')">Recetas</button></li>
              <!--<li><button type="button" (click)="navegar('presentaciones')">Presentaciones de componentes</button></li>-->
            </ul>
          </li>

          <li class="menu-item"
              (mouseenter)="showSubmenu('reportes')"
              (mouseleave)="hideSubmenu('reportes')">
            <button class="menu-link" type="button" (click)="toggleSubmenu('reportes')">
              Reportes
            </button>
            <ul class="submenu" *ngIf="visibleMenu === 'reportes'">
              <li><button type="button" (click)="navegar('disolucion')">Procesos de disolución</button></li>
            </ul>
          </li>

          <li class="menu-item"
              *ngIf="(isAdmin$ | async)"
              (mouseenter)="showSubmenu('usuarios')"
              (mouseleave)="hideSubmenu('usuarios')">
            <button class="menu-link" type="button" (click)="toggleSubmenu('usuarios')">
              Usuarios
            </button>
            <ul class="submenu" *ngIf="visibleMenu === 'usuarios'">
              <li><button type="button" (click)="navegar('usuarios')">Gestión de usuarios</button></li>
            </ul>
          </li>

          <!--<li class="menu-item"
              (mouseenter)="showSubmenu('herramientas')"
              (mouseleave)="hideSubmenu('herramientas')">
            <button class="menu-link" type="button" (click)="toggleSubmenu('herramientas')">
              Herramientas
            </button>
            <ul class="submenu" *ngIf="visibleMenu === 'herramientas'">
              <li><button type="button" (click)="navegar('herramientas')">Crear etiquetas</button></li>
            </ul>
          </li>-->

        </ul>
      </nav>

      <button class="btn-logout" type="button" (click)="onLogout()">Salir</button>
    </div>
  </header>



  <!-- Modales -->
  <app-componentes-modal
    *ngIf="mostrarModal"
    (cerrarModal)="cerrarModalComponentes()">
  </app-componentes-modal>

  <app-recetas
      *ngIf="mostrarRecetas"
      (cerrarModal)="cerrarModalComponentes()">
  </app-recetas>

  <app-procesos-disolucion
      *ngIf="mostrarProcesos"
      [visible]="mostrarProcesos"
      (cerrarModal)="cerrarModalComponentes()">
  </app-procesos-disolucion>

  <app-usuarios
    *ngIf="mostrarUsuarios"
    [visible]="mostrarUsuarios"
    (cerrarModal)="cerrarModalComponentes()">
  </app-usuarios>

  <app-presentaciones
    *ngIf="mostrarPresentaciones"
    [visible]="mostrarPresentaciones"
    (cerrarModal)="cerrarModalComponentes()">
  </app-presentaciones>

  <app-herramientas
    *ngIf="mostrarHerramientas"
    [(visible)]="mostrarHerramientas"
    (imprimirPayload)="onImprimir($event)">
  </app-herramientas>

</div>

<!-- Área pública (login, etc.) -->
<ng-template #publicArea>
  <router-outlet></router-outlet>
</ng-template>

<p-toast position="top-right"
         appendTo="body"
         [baseZIndex]="12000"
         [preventOpenDuplicates]="true">
</p-toast>
