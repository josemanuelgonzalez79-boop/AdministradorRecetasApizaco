<!-- Plataforma privada: conserva todos los modales y sus eventos existentes. -->
<div
  *ngIf="(isAuth$ | async); else publicArea"
  class="admin-layout"
  [class.has-modal]="mostrarModal || mostrarRecetas || mostrarProcesos || mostrarUsuarios || mostrarPresentaciones || mostrarHerramientas"
>
  <header class="app-bar">
    <div class="bar">
      <button class="marca" type="button" (click)="irInicio()" aria-label="Volver al inicio">
        <img ngSrc="assets/LOGO-ICAP.png" width="640" height="257" alt="Logo ICAP" priority class="logo" />
        <span class="marca__texto"><strong>Administrador de Recetas</strong><small>Plataforma de formulación</small></span>
      </button>

      <nav class="menu" aria-label="Navegación principal">
        <ul class="menu-list">
          <li class="menu-item">
            <button class="menu-link menu-link--inicio" type="button" (click)="irInicio()">
              <i class="pi pi-home" aria-hidden="true"></i> Inicio
            </button>
          </li>
          <li class="menu-item"
              (mouseenter)="showSubmenu('formulacion')"
              (mouseleave)="hideSubmenu('formulacion')">
            <button class="menu-link" type="button" (click)="toggleSubmenu('formulacion')"
              [attr.aria-expanded]="visibleMenu === 'formulacion'" aria-haspopup="true">
              <i class="pi pi-sliders-h" aria-hidden="true"></i> Formulación <i class="pi pi-angle-down menu-flecha" aria-hidden="true"></i>
            </button>
            <ul class="submenu" *ngIf="visibleMenu === 'formulacion'">
              <li><button type="button" (click)="navegar('componentes')"><i class="pi pi-box" aria-hidden="true"></i> Componentes</button></li>
              <li><button type="button" (click)="navegar('recetas')"><i class="pi pi-book" aria-hidden="true"></i> Recetas</button></li>
              <!-- Presentaciones reservado para implementación futura. -->
              <!--<li><button type="button" (click)="navegar('presentaciones')">Presentaciones de componentes</button></li>-->
            </ul>
          </li>

          <li class="menu-item"
              (mouseenter)="showSubmenu('reportes')"
              (mouseleave)="hideSubmenu('reportes')">
            <button class="menu-link" type="button" (click)="toggleSubmenu('reportes')"
              [attr.aria-expanded]="visibleMenu === 'reportes'" aria-haspopup="true">
              <i class="pi pi-chart-bar" aria-hidden="true"></i> Reportes <i class="pi pi-angle-down menu-flecha" aria-hidden="true"></i>
            </button>
            <ul class="submenu" *ngIf="visibleMenu === 'reportes'">
              <li><button type="button" (click)="navegar('disolucion')"><i class="pi pi-file-pdf" aria-hidden="true"></i> Procesos de disolución</button></li>
            </ul>
          </li>

          <li class="menu-item" *ngIf="(isAdmin$ | async)"
              (mouseenter)="showSubmenu('usuarios')"
              (mouseleave)="hideSubmenu('usuarios')">
            <button class="menu-link" type="button" (click)="toggleSubmenu('usuarios')"
              [attr.aria-expanded]="visibleMenu === 'usuarios'" aria-haspopup="true">
              <i class="pi pi-users" aria-hidden="true"></i> Usuarios <i class="pi pi-angle-down menu-flecha" aria-hidden="true"></i>
            </button>
            <ul class="submenu" *ngIf="visibleMenu === 'usuarios'">
              <li><button type="button" (click)="navegar('usuarios')"><i class="pi pi-cog" aria-hidden="true"></i> Gestión de usuarios</button></li>
            </ul>
          </li>
          <!-- Herramientas deliberadamente ocultas mientras no se implementen. -->
        </ul>
      </nav>

      <div class="bar__acciones">
        <span class="rol-indicador" *ngIf="rol$ | async as rol"><i class="pi pi-circle-fill" aria-hidden="true"></i> {{ rol | titlecase }}</span>
        <button class="btn-logout" type="button" (click)="onLogout()" title="Cerrar sesión">
          <i class="pi pi-sign-out" aria-hidden="true"></i><span>Salir</span>
        </button>
      </div>
    </div>
  </header>

  <app-inicio-dashboard (abrirModulo)="navegar($event)"></app-inicio-dashboard>

  <!-- Se conservan todos los modales existentes, sin cambios funcionales. -->
  <app-componentes-modal *ngIf="mostrarModal" (cerrarModal)="cerrarModalComponentes()"></app-componentes-modal>
  <app-recetas *ngIf="mostrarRecetas" (cerrarModal)="cerrarModalComponentes()"></app-recetas>
  <app-procesos-disolucion *ngIf="mostrarProcesos" [visible]="mostrarProcesos" (cerrarModal)="cerrarModalComponentes()"></app-procesos-disolucion>
  <app-usuarios *ngIf="mostrarUsuarios" [visible]="mostrarUsuarios" (cerrarModal)="cerrarModalComponentes()"></app-usuarios>
  <app-presentaciones *ngIf="mostrarPresentaciones" [visible]="mostrarPresentaciones" (cerrarModal)="cerrarModalComponentes()"></app-presentaciones>
  <app-herramientas *ngIf="mostrarHerramientas" [(visible)]="mostrarHerramientas" (imprimirPayload)="onImprimir($event)"></app-herramientas>
</div>

<ng-template #publicArea><router-outlet></router-outlet></ng-template>
<p-toast position="top-right" appendTo="body" [baseZIndex]="12000" [preventOpenDuplicates]="true"></p-toast>
